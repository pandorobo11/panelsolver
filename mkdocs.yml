site_name: Panel Solver
site_description: Offline documentation for the panelsolver distribution.
docs_dir: docs
use_directory_urls: false
theme:
  name: readthedocs
  highlightjs: false
plugins: []
extra_css:
  - assets/stylesheets/panelsolver-docs.css
extra_javascript:
  - assets/javascripts/panelsolver-docs.js
markdown_extensions:
  - tables
  - panelsolver_docs_math
nav:
  - Panel Solver: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Case files: user-guide/case-files.md
      - Troubleshooting: user-guide/troubleshooting.md
  - FMF:
      - Overview: solvers/fmf-overview.md
      - Input: reference/fmf-input.md
      - Sentman model: solvers/fmf.md
  - Hypersonic:
      - Overview: solvers/hypersonic-overview.md
      - Input: reference/hypersonic-input.md
      - Pressure models: solvers/hypersonic.md
  - Usage:
      - CLI: user-guide/cli.md
      - GUI: user-guide/gui.md
      - Python API: reference/python-api.md
      - Outputs: user-guide/outputs.md
      - Shielding / parallel execution: user-guide/shielding-and-parallel.md
  - Reference:
      - Numerical conventions: reference/numerical-conventions.md
      - Environment variables: reference/environment-variables.md
      - Compatibility: reference/compatibility.md
      - Output formats: reference/output-formats.md
      - US1976 provenance: reference/us1976-data-provenance.md
      - License / third-party notices: reference/license-and-third-party-notices.md
  - Development:
      - Architecture: development/architecture.md
      - Setup / Testing: development/setup-and-testing.md
      - Release / Rollback: development/release-and-rollback.md
  - History:
      - Overview: history/README.md
      - ADR:
          - Index: adr/README.md
          - ADR 0001: adr/0001-single-repository.md
          - ADR 0002: adr/0002-panel-load-vector-contract.md
          - ADR 0003: adr/0003-dependency-direction.md
          - ADR 0004: adr/0004-compatibility-frontends.md
          - ADR 0005: adr/0005-case-signature-versioning.md
          - ADR 0006: adr/0006-mesh-loading-and-fingerprints.md
          - ADR 0007: adr/0007-single-distribution-compatibility-versions.md
          - ADR 0008: adr/0008-supported-domain-compatibility.md
          - ADR 0009: adr/0009-remove-npz-output.md
          - ADR 0010: adr/0010-remove-legacy-xls-input.md
          - ADR 0011: adr/0011-canonical-domain-naming.md
          - ADR 0012: adr/0012-runtime-artifact-distribution-version.md
          - ADR 0013: adr/0013-canonical-project-identity.md
      - Migration:
          - Plan: history/migration/MIGRATION_PLAN.md
          - Sources: history/migration/MIGRATION_SOURCES.md
          - Phase 3 adapters: history/migration/PHASE3_ADAPTERS.md
          - Phase 4 models: history/migration/PHASE4_MODELS.md
          - Phase 5 execution: history/migration/PHASE5_EXECUTION.md
          - Phase 6 GUI: history/migration/PHASE6_GUI.md
          - Phase 7 compatibility: history/migration/PHASE7_COMPATIBILITY.md
          - Phase 7 user guide: history/migration/PHASE7_USER_GUIDE.md
          - Phase 1:
              - Behavioral inventory: history/migration/phase1/BEHAVIORAL_INVENTORY.md
              - Golden baselines: history/migration/phase1/GOLDEN_BASELINES.md
              - Legacy differences: history/migration/phase1/LEGACY_DIFFERENCES.md
              - Tolerances: history/migration/phase1/TOLERANCES.md
      - Audit records:
          - Phase 7 execution: history/audits/PHASE7_EXECUTION_RECORD.md
          - Phase 8 execution: history/audits/PHASE8_EXECUTION_RECORD.md
          - Phase 8 final audit: history/audits/PHASE8_FINAL_AUDIT.md
