site_name: Panel Solver
site_description: Offline documentation for the panelsolver distribution.
docs_dir: docs
use_directory_urls: false
theme:
  name: readthedocs
  highlightjs: false
plugins: []
extra_css:
  - assets/stylesheets/panelsolver-docs.css
extra_javascript:
  - assets/javascripts/panelsolver-docs.js
markdown_extensions:
  - tables
  - panelsolver_docs_math
nav:
  - Panel Solver: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Preparing cases: guides/preparing-cases.md
      - Using the GUI: guides/gui.md
      - Viewing results in the GUI: guides/gui-viewer.md
      - Using the CLI: guides/cli.md
      - Sectional loads and Cp: guides/sectional.md
      - Batch runs and recovery: guides/batch-runs.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - FMF case table: reference/fmf-case-table.md
      - Hypersonic case table: reference/hypersonic-case-table.md
      - Sectional definition CSV: reference/sectional-definitions.md
      - Summary CSV: reference/summary-csv.md
      - VTP: reference/vtp.md
      - Sectional load CSV: reference/sectional-loads-csv.md
      - Sectional Cp CSV: reference/sectional-cp-csv.md
      - Python API: reference/python-api.md
      - Environment variables: reference/environment-variables.md
  - Methods:
      - Coordinate and attitude conventions: methods/coordinate-and-attitude-conventions.md
      - Load and coefficient conventions: methods/load-and-coefficient-conventions.md
      - FMF / Sentman model: methods/fmf.md
      - Hypersonic pressure methods: methods/hypersonic.md
      - Ray shielding: methods/ray-shielding.md
  - About:
      - Compatibility and versioning: about/compatibility.md
      - US1976 data provenance: about/us1976-data-provenance.md
      - License and third-party notices: about/license-and-third-party-notices.md
