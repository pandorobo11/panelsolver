site_name: Panel Solver
site_description: Offline documentation for the panelsolver distribution.
docs_dir: docs
use_directory_urls: false
theme:
  name: readthedocs
  highlightjs: false
plugins: []
extra_css:
  - assets/stylesheets/panelsolver-docs.css
extra_javascript:
  - assets/javascripts/panelsolver-docs.js
markdown_extensions:
  - tables
  - panelsolver_docs_math
nav:
  - Panel Solver: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Methods and conventions:
      - Coordinate and attitude conventions: reference/coordinate-and-attitude-conventions.md
      - Load and coefficient conventions: reference/load-and-coefficient-conventions.md
      - FMF / Sentman model: solvers/fmf.md
      - Hypersonic pressure methods: solvers/hypersonic.md
      - Ray shielding: reference/ray-shielding.md
  - Inputs:
      - Case tables and geometry: user-guide/case-files.md
      - FMF input reference: reference/fmf-input.md
      - Hypersonic input reference: reference/hypersonic-input.md
  - Running calculations:
      - GUI: user-guide/gui.md
      - CLI: user-guide/cli.md
      - Python API: reference/python-api.md
      - Batch execution and recovery: user-guide/batch-execution-and-recovery.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Results:
      - Summary CSV reference: results/summary-csv.md
      - VTP reference: results/vtp.md
  - Product reference:
      - Environment variables: reference/environment-variables.md
      - Compatibility and versioning: reference/compatibility.md
  - Appendix:
      - US1976 data provenance: reference/us1976-data-provenance.md
      - License and third-party notices: reference/license-and-third-party-notices.md
