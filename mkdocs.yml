site_name: Panel Solver
site_description: Offline documentation for the panelsolver distribution.
docs_dir: docs
use_directory_urls: false
theme:
  name: readthedocs
  highlightjs: false
plugins: []
extra_css:
  - assets/stylesheets/panelsolver-docs.css
extra_javascript:
  - assets/javascripts/panelsolver-docs.js
markdown_extensions:
  - tables
  - panelsolver_docs_math
nav:
  - Panel Solver: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Methods and conventions:
      - Coordinate and attitude conventions: methods/coordinate-and-attitude-conventions.md
      - Load and coefficient conventions: methods/load-and-coefficient-conventions.md
      - FMF / Sentman model: methods/fmf.md
      - Hypersonic pressure methods: methods/hypersonic.md
      - Ray shielding: methods/ray-shielding.md
  - Inputs:
      - Case tables and geometry: inputs/case-files.md
      - FMF input reference: inputs/fmf-input.md
      - Hypersonic input reference: inputs/hypersonic-input.md
  - Running calculations:
      - GUI: running/gui.md
      - CLI: running/cli.md
      - Python API: running/python-api.md
      - Batch execution and recovery: running/batch-execution-and-recovery.md
      - Troubleshooting: running/troubleshooting.md
  - Results:
      - Summary CSV reference: results/summary-csv.md
      - VTP reference: results/vtp.md
  - Product reference:
      - Environment variables: product-reference/environment-variables.md
      - Compatibility and versioning: product-reference/compatibility.md
  - Appendix:
      - US1976 data provenance: appendix/us1976-data-provenance.md
      - License and third-party notices: appendix/license-and-third-party-notices.md
