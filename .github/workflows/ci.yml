name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Only PR runs share a cancellable group; main/tag runs have unique run IDs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Formatting
        run: uv run --no-sync ruff format --check src tests scripts hatch_build.py

      - name: Static checks
        run: uv run --no-sync ruff check src tests scripts hatch_build.py

      - name: Scoped typing
        run: >-
          uv run --no-sync mypy
          src/panelsolver/core/contracts.py
          src/panelsolver/core/execution.py
          src/panelsolver/models/registry.py
          src/panelsolver/app/execution.py
          src/panelsolver/api.py
          src/panelsolver/__init__.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --locked --extra rayaccel --group docs

      - name: Verify Embree backend availability
        run: >-
          uv run --no-sync python -c "import trimesh; from trimesh import ray;
          print('trimesh_version:', trimesh.__version__);
          print('has_embree:', ray.has_embree);
          (_ for _ in ()).throw(SystemExit('Embree backend is required in CI but not available.'))
          if not ray.has_embree else None"

      - name: Tests
        timeout-minutes: 10
        run: uv run --no-sync pytest --durations=30

      - name: Scheduler lifecycle stress
        timeout-minutes: 3
        run: >-
          uv run --no-sync python scripts/probe_scheduler_lifecycle.py
          --iterations 10 --timeout-seconds 90

  distribution-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --locked --extra rayaccel --group docs

      - name: Verify generated US1976 Sentman table
        run: >-
          uv run --no-sync python
          scripts/generate_us1976_sentman_table.py --check

      - name: Verify generated documentation plots
        run: >-
          uv run --no-sync python
          scripts/generate_docs_angle_response_plots.py --check

      - name: Build offline documentation strictly
        run: uv run --no-sync mkdocs build --strict

      - name: Build distributions
        run: uv build

      - name: Verify wheel, sdist, and isolated sdist wheel rebuild
        run: >-
          uv run --no-sync python scripts/release_tools.py
          verify-distributions . --dist-dir dist

      - name: Create deterministic release archives
        run: >-
          uv run --no-sync python scripts/release_tools.py
          create-release-archives . --dist-dir dist

      - name: Create and verify distribution manifest
        run: >-
          uv run --no-sync python scripts/release_tools.py create-manifest .
          --commit-sha "${{ github.sha }}" --output dist/manifest.json
          --dist-dir dist

      - name: Verify exact release artifact set
        run: >-
          uv run --no-sync python scripts/release_tools.py verify-manifest .
          --manifest dist/manifest.json --dist-dir dist
          --expected-commit "${{ github.sha }}"

      - name: Verify release tag against protected main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main --tags --force
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_COMMIT="$(git rev-parse refs/remotes/origin/main^{commit})"
          uv run --no-sync python scripts/release_tools.py verify-tag . "$TAG" \
            --expected-commit "$EXPECTED_COMMIT"
          uv run --no-sync python scripts/release_tools.py verify-github-state . \
            --repository-name pandorobo11/panelsolver \
            --expected-commit "$EXPECTED_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dry-run a hypothetical release version
        run: >-
          uv run --no-sync python scripts/release_tools.py dry-run .

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: panelsolver-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error

  installed-wheel:
    needs: [distribution-build, quality]
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra rayaccel --group docs

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: panelsolver-dist-${{ github.run_id }}
          path: dist

      - name: Verify downloaded distribution manifest
        run: >-
          uv run --no-sync python scripts/release_tools.py verify-manifest .
          --manifest dist/manifest.json --dist-dir dist
          --expected-commit "${{ github.sha }}"

      - name: Reinstall exact verified wheel
        run: >-
          uv run --no-sync python scripts/release_tools.py reinstall-wheel .
          --dist-dir dist

      - name: Smoke installed commands outside repository
        run: >-
          uv run --no-sync python scripts/smoke_installed_wheel.py .
          --dist-dir dist

  clean-install:
    needs: [distribution-build, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: panelsolver-dist-${{ github.run_id }}
          path: dist

      - name: Verify downloaded release artifact set
        run: >-
          python scripts/release_tools.py verify-manifest .
          --manifest dist/manifest.json --dist-dir dist
          --expected-commit "${{ github.sha }}"

      - name: Install exact wheel with dependencies into an empty environment
        shell: bash
        run: |
          CLEAN_VENV="${RUNNER_TEMP}/panelsolver-clean"
          WHEEL="$(python scripts/release_tools.py verify-wheel . --dist-dir dist)"
          uv venv --python 3.12 "${CLEAN_VENV}"
          uv pip install --python "${CLEAN_VENV}/bin/python" "${WHEEL}[rayaccel]"
          cd "${RUNNER_TEMP}"
          QT_QPA_PLATFORM=offscreen "${CLEAN_VENV}/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/smoke_installed_wheel.py" \
            "${GITHUB_WORKSPACE}" --dist-dir "${GITHUB_WORKSPACE}/dist"

  # Keep the protected-main context, and fail closed even if a consumer is skipped.
  # Quality previously gated the required test jobs; retain it in this required gate.
  artifact:
    needs: [quality, distribution-build, installed-wheel, clean-install]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every prerequisite to succeed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["NEEDS_RESULTS"])
          if not results or any(job["result"] != "success" for job in results.values()):
              raise SystemExit(f"Required validation did not succeed: {results}")
          PY

  release:
    needs: [test, artifact]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: panelsolver-dist-${{ github.run_id }}
          path: dist

      - name: Validate release target and distributions
        shell: bash
        run: |
          git fetch origin main --tags --force
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_COMMIT="$(git rev-parse refs/remotes/origin/main^{commit})"
          python scripts/release_tools.py verify-tag . "$TAG" \
            --expected-commit "$EXPECTED_COMMIT"
          python scripts/release_tools.py verify-github-state . \
            --repository-name pandorobo11/panelsolver \
            --expected-commit "$EXPECTED_COMMIT"
          python scripts/release_tools.py verify-manifest . \
            --manifest dist/manifest.json --dist-dir dist \
            --expected-commit "${{ github.sha }}"
          python scripts/release_tools.py release-notes . --output release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Infer GitHub prerelease state
        id: release-metadata
        shell: bash
        run: >-
          echo "prerelease=$(python scripts/release_tools.py prerelease .)"
          >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ steps.release-metadata.outputs.prerelease }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/panelsolver-docs-v*.zip
            dist/panelsolver-examples-v*.zip
            dist/manifest.json