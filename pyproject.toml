[project]
name = "panelsolver"
version = "0.1.0"
description = "Shared panel-solver platform for free-molecular and hypersonic flow models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES/*"]
authors = [
  { name = "pandorobo11" },
]
maintainers = [
  { name = "pandorobo11" },
]
dependencies = [
  "networkx",
  "numpy",
  "openpyxl",
  "pandas",
  "pyside6>=6.9.3,<7",
  "pyvista",
  "pyvistaqt>=0.12",
  "rich>=15,<16",
  "rich-argparse>=1.8,<2",
  "rtree",
  "scipy",
  "trimesh",
]

[project.urls]
Homepage = "https://github.com/pandorobo11/panelsolver"
Repository = "https://github.com/pandorobo11/panelsolver"
Issues = "https://github.com/pandorobo11/panelsolver/issues"

[project.optional-dependencies]
rayaccel = [
  "embreex4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "embreex; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.scripts]
panelsolver = "panelsolver.cli:main"
panelsolver-gui = "panelsolver.gui:main"
fmfsolver = "fmfsolver.app.gui_app:main"
fmfsolver-gui = "fmfsolver.app.gui_app:main"
fmfsolver-cli = "fmfsolver.app.cli_app:main"
newtsolver = "newtsolver.app.gui_app:main"
newtsolver-gui = "newtsolver.app.gui_app:main"
newtsolver-cli = "newtsolver.app.cli_app:main"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]
docs = [
  "latex2mathml==3.81.0",
  "matplotlib",
  "mkdocs==1.6.1",
]

[build-system]
requires = [
  "hatchling>=1.27",
  "latex2mathml==3.81.0",
  "mkdocs==1.6.1",
]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/THIRD_PARTY_LICENSES",
  "/devdocs",
  "/docs",
  "/examples",
  "/hatch_build.py",
  "/mkdocs.yml",
  "/pyproject.toml",
  "/scripts/generate_us1976_sentman_table.py",
  "/tools/reference/pdas/bigtables_v1_5.py",
  "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panelsolver", "src/fmfsolver", "src/newtsolver"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Broad catches remain acceptable only at GUI, worker-process, and optional-
# backend boundaries. These exceptions match the stricter legacy baseline.
ignore = ["BLE001", "EXE001", "S110", "SIM113", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "slow: exercises real process/subprocess lifecycle or other high-wall-time integration behavior",
]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
show_error_codes = true
